[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owl24-py"
version = "0.1.8"
description = "Python SDK for owl24 - one line of code to send logs, traces, and metrics to your owl24 dashboard, built on OpenTelemetry, with errors queued straight to your own coding agent to fix and PR."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Madnands5" }
]
keywords = ["observability", "opentelemetry", "apm", "tracing", "logging", "monitoring", "error-tracking", "coding-agent", "ai-agent", "owl24"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    # Floor raised to 1.39 (not the original 1.27): that's the release where
    # opentelemetry.sdk._logs.LogRecord was removed in favor of passing
    # kwargs directly to Logger.emit(), which is what telemetry.py now does
    # - older versions don't support that emit() signature.
    "opentelemetry-api>=1.39.0,<2.0.0",
    "opentelemetry-sdk>=1.39.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.39.0,<2.0.0",
    # Host metrics (CPU/memory/network) - the Python equivalent of
    # owl24-js's @opentelemetry/host-metrics and owl24-java's
    # runtime-telemetry-java8. A hard dependency (unlike the framework
    # instrumentations below) since it's universal - no per-framework
    # variance, so there's no reason to make it opt-in.
    "opentelemetry-instrumentation-system-metrics>=0.65b0",
    # Promoted from an optional extra in 0.1.1: a consumer that installed
    # plain `owl24-py` (no `[fastapi]` extra) got a fully-wired but
    # permanently empty trace pipeline - FastAPIInstrumentor's import
    # silently failed, no spans were ever created, and the exporter's
    # "traces" status stayed PENDING forever with no working/not-working
    # signal either way. Installing this instrumentor package unconditionally
    # fixes that for FastAPI consumers with zero extra config - but does NOT
    # mean `FastAPIInstrumentor` is safe to import unconditionally in
    # telemetry.py (a real 0.1.2-0.1.6 bug: its own __init__.py does its own
    # unconditional `import fastapi`, which crashes any Flask/Django consumer
    # that never installed the real fastapi package - see telemetry.py's
    # try/except around this one now, same as every other instrumentor below).
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    # Everything below was previously gated behind `[project.optional-
    # dependencies]` extras (owl24-py[flask]/[django]/[psycopg2]/etc.) -
    # promoted to hard dependencies for the same reason FastAPI was above,
    # generalized: a consumer shouldn't have to know or remember which extra
    # unlocks tracing for a framework/driver they already use, and every
    # owl24 SDK except this one already behaves this way (owl24-js's
    # getNodeAutoInstrumentations() bundles all of its instrumentations
    # unconditionally, no extras at all). None of these packages are the
    # actual framework/driver library itself (Flask/Django/psycopg2/pymongo/
    # pymysql/SQLAlchemy remain the consumer's own dependency, same as a
    # plain `requests` import always has been) - they're lightweight OTel
    # wrapt-based patchers that only activate if the real library the
    # consumer's own app already depends on happens to be installed; each
    # one stays try/except-guarded in telemetry.py (defensive only now, not
    # gating availability), so init() degrades gracefully regardless of
    # which frameworks/drivers a given consumer's app actually uses.
    "opentelemetry-instrumentation-flask>=0.65b0",
    "opentelemetry-instrumentation-django>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-psycopg2>=0.65b0",
    "opentelemetry-instrumentation-pymongo>=0.65b0",
    "opentelemetry-instrumentation-pymysql>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0"
]

[project.optional-dependencies]
# Task 12 (todolist.md, added 2026-08-23) - pytest wasn't a dependency
# anywhere in this file before. An optional extra (`pip install
# owl24-py[test]`), not a hard dependency, since a real consumer installing
# this SDK into their own app has no reason to also pull in a test runner.
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.urls]
Homepage = "https://owl24.dev"
Repository = "https://github.com/Madnands5/owl24-py"